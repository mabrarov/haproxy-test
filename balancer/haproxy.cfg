global
    log stdout len 4096 format raw local0

defaults
    log global
    option httplog
    option forwardfor if-none
    mode http
    timeout connect 10s
    timeout client 10s
    timeout server 10s
    default-server init-addr none

frontend http_front
    bind *:8080
    default_backend http_back
    http-request capture req.hdr(Host) len 1000
    http-request capture req.hdr(Referer) len 1000
    unique-id-format "%{+X}o %ci:%cp_%fi:%fp_%Ts_%rt:%pid"
    unique-id-header X-Request-ID
    log-format '{"pid": %pid, "haproxy_frontend_type": "http", "haproxy_process_concurrent_connections": %ac, "haproxy_frontend_concurrent_connections": %fc, "haproxy_backend_concurrent_connections": %bc, "haproxy_server_concurrent_connections": %sc, "haproxy_backend_queue": %bq, "haproxy_server_queue": %sq, "haproxy_client_request_send_time": %Tq, "haproxy_queue_wait_time": %Tw, "haproxy_server_wait_time": %Tc, "haproxy_server_response_send_time": %Tr, "response_time": %Td, "session_duration": %Tt, "request_termination_state": "%tsc", "haproxy_server_connection_retries": %rc, "remote_addr": "%ci", "remote_port": %cp, "frontend_addr": "%fi", "frontend_port": %fp, "frontend_ssl_version": "%sslv", "frontend_ssl_ciphers": "%sslc", "request_method": "%HM", "request_uri": "%[capture.req.uri,json(utf8s)]", "request_http_version": "%HV", "host": "%[capture.req.hdr(0),json(utf8s)]", "referer": "%[capture.req.hdr(1),json(utf8s)]", "haproxy_frontend_name": "%f", "haproxy_backend_name": "%b", "haproxy_server_name": "%s", "status": %ST, "response_size": %B, "request_size": %U, "request_id": "%[unique-id,json(utf8s)]"}'
    http-request set-header Host %[req.hdr(Host),lower]
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    http-request set-header X-Forwarded-Port %[dst_port]
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request add-header Forwarded by=%[dst]:%[dst_port];for=%[src]:%[src_port];host=%[req.hdr(Host)];proto=%[req.hdr(X-Forwarded-Proto)]

backend http_back
    balance roundrobin
    option httpchk
    http-check send hdr User-Agent "${BACKEND_CHECK_USER_AGENT}"
    server-template backend 10 "${BACKEND_HOST}:${BACKEND_PORT}" check inter 5s resolvers docker_resolver resolve-prefer ipv4

resolvers docker_resolver
    nameserver dns 127.0.0.11:53
    hold valid 1s
