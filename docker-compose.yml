x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "12m"
    max-file: "5"

services:
  balancer:
    build: "balancer"
    image: "abrarov/haproxy-test-balancer"
    environment:
      RESOLVER_HOST: "127.0.0.11"
      RESOLVER_PORT: "53"
      BACKEND_HOST: "backend"
      BACKEND_PORT: "8080"
    ports:
      - "80:8080"
    logging: *default-logging
    labels:
      shipyard.route: "/"

  backend:
    build: "backend"
    image: "abrarov/haproxy-test-backend"
    logging: *default-logging

  blackbox:
    build: "blackbox"
    image: "abrarov/haproxy-test-blackbox"
    ports:
    - "9115:9115"
    logging: *default-logging
